services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - JELLYFIN_PublishedServerUrl=http://192.168.0.5 #optional
    volumes:
      - ${HOME}/Docker/media/jellyfin/library:/config
      - /mnt/external/drama:/data/tvshows
      - /mnt/external/Movies:/data/movies
    ports:
      - 8096:8096
    restart: unless-stopped

  openbooks:
    image: evanbuss/openbooks:latest
    container_name: openbooks
    ports:
      - "8097:80"  # Host port:Container port
    volumes:
      - ${HOME}/Docker/media/openbooks:/books
    restart: unless-stopped
    command: openbooks server --name jonathan --persist --log

volumes:
  openbooks: